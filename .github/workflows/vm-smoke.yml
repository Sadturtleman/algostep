name: Isolated VM smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require real KVM
        run: test -c /dev/kvm
      - run: npm ci
      - name: Download verified Firecracker release
        shell: bash
        run: |
          mkdir -p /tmp/fc-tools
          cd /tmp/fc-tools
          base=https://github.com/firecracker-microvm/firecracker/releases/download/v1.17.0
          curl -fLO "$base/firecracker-v1.17.0-x86_64.tgz"
          curl -fLO "$base/firecracker-v1.17.0-x86_64.tgz.sha256.txt"
          sha256sum -c firecracker-v1.17.0-x86_64.tgz.sha256.txt
          tar -xzf firecracker-v1.17.0-x86_64.tgz
          sudo install release-v1.17.0-x86_64/firecracker-v1.17.0-x86_64 /usr/local/bin/firecracker
          sudo install release-v1.17.0-x86_64/jailer-v1.17.0-x86_64 /usr/local/bin/jailer
      - name: Build guest and obtain official test kernel
        run: |
          bash apps/runner/build-rootfs.sh
          python3 scripts/download-test-kernel.py
      - name: Execute reference programs in disposable VMs
        run: |
          sudo env PATH="$PATH" KERNEL_PATH="$PWD/apps/runner/images/vmlinux" ROOTFS_PATH="$PWD/apps/runner/images/rootfs.ext4" RUNNER_WORKDIR=/tmp/algostep-vms node --import tsx scripts/vm-smoke.ts
