name: Android package
on:
  push:
    branches: [main, 'codex/**']
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      web_origin:
        description: HTTPS service origin
        default: https://algostep.invalid
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p apps/android assembleDebug lintDebug testDebugUnitTest "-PwebOrigin=$WEB_ORIGIN"
        env:
          WEB_ORIGIN: ${{ inputs.web_origin || 'https://algostep.invalid' }}
      - uses: actions/upload-artifact@v4
        with:
          name: algostep-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
