services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: algostep
      POSTGRES_USER: algostep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U algostep']
      interval: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://algostep:${POSTGRES_PASSWORD}@db:5432/algostep
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['127.0.0.1:8080:80']
    depends_on: [server]
volumes:
  postgres-data:
